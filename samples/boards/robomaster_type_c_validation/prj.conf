CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_MINIMAL_LIBCPP=y

CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_CAN=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_SHELL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_HELP_OPT_PARSE=y
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_CMDS_RETURN_VALUE=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_PROMPT_UART="type-c:~$ "
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=512

CONFIG_I2C_SHELL=y
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_PWM_SHELL=n
CONFIG_CAN_SHELL=n
CONFIG_WDT_SHELL=n
